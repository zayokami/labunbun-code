name: CI

# The three gates package.json declares, run on every push and every pull
# request, plus a compile on all three platforms. `pnpm lint` is
# `biome check --error-on-warnings .`, `pnpm typecheck` is `tsc -p
# tsconfig.check.json`, `pnpm test` is `bun test` — the same three commands a
# developer runs, not a paraphrase of them. A separate ubuntu `coverage` leg
# runs that same suite under Bun's instrumentation and uploads lcov; it is not
# one of the three gates and does not change them.
#
# No secrets, deliberately. The suite claims in README that it needs no network
# and no key, and a repository secret would turn that from a property into an
# assumption: the day a test starts needing a key it should fail loudly rather
# than quietly depend on something the workflow supplies.
#
# What this will not check, stated here rather than left to be discovered by
# assuming test coverage:
#   - `packages/tui/test/vim-differential/` is `.mjs` and outside `bun test`. It
#     needs a real `vim` on the machine, and its exit code 77 means "did not
#     compare" — a run that could not compare has not earned a pass.
#   - The emacs citation guard skips: it reads a local source tree and is
#     `existsSync`-gated, so the ~300 `file:line` citations are unverified here.
#   - The deepseek-harness flow guard and the three snapshot-log tests are gated
#     the same way, for the same reason. Their coverage is genuinely lost.
#   - The mutation drivers live in %TEMP% and are not in version control, so no
#     clone can re-run them.
#   - `tsconfig.check.json` does not include `packages/coding-agent/bin/`, which
#     is the entry point for both bins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One shell everywhere. Two reasons: the compile command is then byte-identical
# across the matrix, so only the outfile string differs; and on Windows it
# sidesteps the pwsh ExecutionPolicy failure on pnpm's .ps1 shim, which is the
# most common way a Windows leg breaks for a reason that is not the code.
defaults:
  run:
    shell: bash

concurrency:
  # The pull_request number is null on a push, so this falls through to the ref:
  # a PR run groups by PR and cancels its own superseded run, while every push
  # to main resolves to the same string, refs/heads/main. A PR can never cancel
  # a push run. One push also never cancels another's in-progress run, because
  # cancel-in-progress is PR-only — but that flag governs only in-progress runs.
  # GitHub separately cancels a previously *pending* run in a group whenever a
  # newer entry queues, so two pushes back to back, or a re-run of an old
  # commit's workflow queued behind the current one, lose the older entrant:
  # measured here on 2026-10-13, when the re-runs of 5836985 and 0660d6d came
  # back "cancelled" without a human touching them.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint and typecheck are ubuntu-only. Neither branches on the platform, and
  # biome reads the working tree rather than the machine, so three copies buy
  # no signal. If either of these ever does need a second platform, the honest
  # way to find out is a test that fails on one, not a runner matrix.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No `version`: the action reads packageManager from package.json, which
      # keeps one source of truth. Pinning it here too would let the two drift
      # silently — pnpm 10.33 and 10.99 both read lockfileVersion 9.0, so a
      # stale pin would keep passing --frozen-lockfile after a real bump.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, unlike pnpm: there is no exact bun version in the repo to
          # derive from (packageManager is pnpm, engines.bun is a range), so
          # omitting this would resolve to whatever is newest on the day. A
          # floating Bun means a red run with no commit to blame.
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The only place three platforms earn their keep: the suite has 16 explicit
  # process.platform gates, path-normalization cases, and the homedir() split
  # between USERPROFILE and HOME that this repo has already been bitten by.
  # fail-fast is off because a matrix that cancels its siblings on the first
  # red is the opposite of diagnosable.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # One coverage leg, on the platform that already runs the suite. Coverage
  # measures the code, not the host, so a second platform would upload a second
  # lcov for the same intent. This job deliberately does not change `pnpm test`:
  # the three `test` legs stay a plain suite, and instrumentation lives here.
  #
  # **No coverage threshold.** The repository has no measured full-suite
  # baseline, and deriving one from a scoped run would be an invented number.
  # The first run of this job publishes the real per-file table in the step
  # summary and uploads lcov; a threshold can be added afterwards with headroom
  # measured from those numbers. Two measured facts about the knobs:
  #   - the text reporter's `All files` row is the mean of per-file
  #     percentages, not a line-weighted total, so compare runs via lcov;
  #   - bunfig's `coverageThreshold` is checked against every file, not that
  #     row (verified on 1.4.4), so a future gate needs a per-file policy or an
  #     lcov-total check.
  # The job does gate on the report being produced: a run that cannot emit lcov
  # has not earned a pass, the same rule the bwrap and vim differential legs use.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      # Bun 1.4.4 writes the text table to stderr and lcov to
      # `coverage/lcov.info` (verified against this version's `--help`, which
      # documents `--coverage-reporter=text|lcov`; `--coverage` is explicit for
      # readability even though the reporter flag implies it). `tee` keeps the
      # table for the summary step, and `pipefail` (also the Actions default)
      # preserves Bun's exit status, so a red suite reds this step.
      - name: test with coverage
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage-output.txt
      # `always()` because a failing suite still produces a coverage table and
      # an lcov file, and both are most useful on the run that went red.
      - name: write coverage summary
        if: always()
        run: |
          {
            echo "## Coverage (ubuntu-latest, Bun 1.4.4)"
            echo
            if grep -q '^File[[:space:]]*[|][[:space:]]*% Funcs' coverage-output.txt 2>/dev/null; then
              echo '```'
              awk '/^File[[:space:]]+[|][[:space:]]*% Funcs/ { in_table = 1; print; next } in_table { if ($0 ~ /^-+[|]/) { print; if (seen_separator) exit; seen_separator = 1; next } print }' coverage-output.txt
              echo '```'
            else
              echo "No coverage table was produced; see the test step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Presence, not a percentage: Bun 1.4.4 exposes no coverage threshold
      # flag, and an empty lcov file would otherwise upload as a green artifact.
      - name: coverage report is real
        run: |
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info
          echo "source files in lcov: $(grep -c '^SF:' coverage/lcov.info)"
      # Kept on failure too: the lcov from a red run is what explains it.
      - name: upload lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/
          if-no-files-found: warn

  # A Linux leg with bubblewrap actually on it.
  #
  # **ubuntu-latest does not ship bubblewrap** — the runner image's installed-apt
  # table has no such entry — which is load-bearing for a test that used to assert
  # the wrapper was applied by proving the spawn failed naming a program that is
  # not installed. Those rows now branch on `detectNativeBackend("linux")`, so
  # without this leg the confined branch never runs anywhere and nobody finds out.
  #
  # **The gate step is the point of the job.** Ubuntu 24.04 sets
  # `kernel.apparmor_restrict_unprivileged_userns=1`, so an unprivileged bwrap
  # fails with "No permissions to creating new namespace". A step that installs
  # the package and hopes is a green job that tested nothing, which is the same
  # failure this repo treats as the expensive one — a run that could not compare
  # has not earned a pass. It is the `exit 77 = did not compare` convention from
  # the vim differential suite, applied to the sandbox.
  test-bwrap:
    name: test (bwrap on PATH)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, and the
      # runner is 24.04, so an unprivileged bwrap fails with
      #   bwrap: setting up uid map: Permission denied
      # This step was measured failing exactly that way before it existed.
      #
      # **An AppArmor profile for bwrap, not a sysctl change.** Flipping the
      # sysctl back to 0 would lift the restriction for every unprivileged binary
      # on the runner, which is the wrong trade for a job whose whole purpose is
      # to prove a sandbox holds. The profile grants the userns operation to one
      # path and leaves the system-wide restriction exactly as Ubuntu ships it.
      - name: let bwrap create a user namespace
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      # The gate. If the profile did not take, or the kernel refuses for another
      # reason, the job stops here with the real error rather than running a suite
      # in which every sandbox row skipped — which is a green job that tested
      # nothing, and the exact failure this leg exists to prevent.
      - name: bwrap can create a namespace here
        run: bwrap --unshare-user --unshare-pid --ro-bind / / -- /bin/echo ok
      - run: pnpm test

  # All three, because "this compiles into a standalone binary on each of them"
  # is a claim the repo has only ever verified on Windows: README says the
  # node-hid prebuild embed was checked there and says nothing about the other
  # two. packages/gamepad/src/sources/node-hid.ts imports it through a literal
  # specifier that a test exists to keep statically analyzable, which is a
  # bundler-resolution property worth proving per host.
  #
  # No `needs`. `needs` delays rather than gates, and on a first run that is
  # expected to be red, a red lint would suppress the entire build matrix —
  # which is the one thing this job is here to find out.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A literal per-OS outfile, so the compile command below is identical on
        # every leg. No arch component on purpose: whether macos-latest is
        # currently arm64 or x64 moves under us, and a wrong guess in the
        # filename is a false claim about a real artifact.
        include:
          - { os: ubuntu-latest, outfile: dist/labunbun-Linux }
          - { os: windows-latest, outfile: dist/labunbun-Windows.exe }
          - { os: macos-latest, outfile: dist/labunbun-macOS }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      # Not `pnpm bin:build`: that script hardcodes dist/labunbun-x64.exe,
      # which is the Windows path README documents and would produce a .exe on
      # Linux and macOS. Calling bun directly is the only way to name the
      # artifact per runner without changing a script meant for local Windows.
      - run: mkdir -p dist
      # --minify is a startup change, not just a size change: the runtime
      # parses and initialises less code before main() runs. Paired A/B runs on
      # Windows measured ~2.7% smaller binaries and a ~15-25 ms faster --version.
      - run: bun build --compile --minify packages/coding-agent/src/main.ts --outfile ${{ matrix.outfile }}
      # --compile proves the bundle resolved and linked; this proves there is
      # actually a file where the command claimed to put one.
      - run: test -s "${{ matrix.outfile }}" && ls -l "${{ matrix.outfile }}"
